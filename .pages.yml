media:
  input: public/media
  output: /media
  extensions: [jpg, jpeg, png, webp, avif, svg]
  categories: [image]
  rename: safe

settings:
  content:
    merge: true

components:
  seo:
    type: object
    label: Google və sosial şəbəkələr
    description: "axtarış nəticəsində və paylaşım zamanı görünən məlumatları idarə edir."
    fields:
      - { name: seo_title, label: Google başlığı, type: string, description: "boş qalsa məqalənin əsas başlığı istifadə edilir; ideal uzunluq 50–60 işarədir." }
      - { name: seo_description, label: Google açıqlaması, type: text, description: "axtarış nəticəsində başlığın altında görünür; ideal uzunluq 140–160 işarədir.", options: { maxlength: 170 } }
      - name: social_image
        label: Paylaşım şəkli
        type: image
        description: "link Instagram, Facebook və digər platformalarda paylaşılarkən görünür; boş qalsa əsas şəkil istifadə edilir."
        options: { media: media, path: social, extensions: [jpg, jpeg, png, webp, avif], rename: safe }

content:
  - name: articles
    label: Məzmunlar
    type: collection
    path: content/articles
    format: yaml-frontmatter
    filename: { template: "{title}.md", field: true }
    description: "saytdakı məqalələri yaradın, şəkillərini dəyişin, ana səhifədə yerini seçin və yayımlayın."
    view:
      primary: title
      fields: [status, category, date, home_section]
      sort: date
      order: desc
      search: "title,description,author,category"
    fields:
      - { name: title, label: Məqalənin başlığı, type: string, required: true, description: "məqalə kartında və açılan səhifənin ən yuxarısında görünür." }
      - { name: description, label: Qısa təqdimat, type: text, required: true, description: "ana səhifədə və məqalə kartında başlığın altında görünən 1–2 cümlədir.", options: { maxlength: 240 } }
      - { name: author, label: Müəllif, type: string, required: true, description: "məqaləni hazırlayan şəxsin və ya redaksiyanın adıdır." }
      - { name: date, label: Yayımlanma tarixi, type: date, required: true, description: "saytda məqalənin tarixi və yeni-köhnə sıralaması üçün istifadə edilir.", options: { format: yyyy-MM-dd } }
      - name: category
        label: Bölmə
        type: select
        required: true
        description: "məqalənin navbar bölmələrindən hansında görünəcəyini müəyyən edir."
        options:
          values: [Dəb, Həyat tərzi, Peşəkarlar, Brendlər, Mədəniyyət]
      - name: image
        label: Əsas şəkil
        type: image
        required: true
        description: "hazırkı şəkli burada görə, silib yenisini seçə və ya kompüterdən yükləyə bilərsiniz; üfüqi, keyfiyyətli şəkil seçin."
        options: { media: media, path: articles, extensions: [jpg, jpeg, png, webp, avif], rename: safe }
      - { name: image_alt, label: Şəklin təsviri, type: string, required: true, description: "şəkli görməyən istifadəçi və Google üçün şəkildə nə olduğunu qısa yazın." }
      - { name: photo_credit, label: Foto müəllifi, type: string, description: "şəklin müəllifini və ya mənbəsini göstərir; lazım deyilsə boş saxlayın." }
      - name: gallery
        label: Məqalədaxili şəkillər
        type: object
        list: true
        description: "məqalənin mətnindən sonra əlavə şəkillər göstərir; + düyməsi ilə istədiyiniz qədər şəkil əlavə edə bilərsiniz."
        fields:
          - name: image
            label: Şəkil
            type: image
            required: true
            description: "şəkli seçin və ya kompüterdən yenisini yükləyin; CMS mövcud şəkli önizləmədə göstərir."
            options: { media: media, path: galleries, extensions: [jpg, jpeg, png, webp, avif], rename: safe }
          - { name: alt, label: Şəklin təsviri, type: string, required: true, description: "şəkildə görünənləri bir cümlə ilə təsvir edin." }
          - { name: caption, label: Şəkilaltı yazı, type: string, description: "şəklin altında oxucuya görünəcək əlavə qeyddir; istəyə bağlıdır." }
      - name: home_section
        label: Ana səhifədə yeri
        type: select
        required: true
        description: "Əsas seçsəniz yuxarıdakı 2 böyük yerdən birində, Kiçik seçsəniz aşağıdakı 4 kartdan birində görünür."
        options:
          values:
            - { name: main, label: Əsas böyük məqalə }
            - { name: small, label: Kiçik məqalə kartı }
            - { name: hidden, label: Ana səhifədə göstərmə }
      - { name: home_order, label: Ana səhifədə sıra, type: number, description: "kiçik rəqəm əvvəl görünür: əsas məqalələr üçün 1–2, kiçik kartlar üçün 3–6 yazın.", options: { min: 1, max: 99 } }
      - { name: background, label: Məqalə səhifəsinin fon rəngi, type: string, required: true, description: "yalnız bu məqalə açıldıqda istifadə edilir; məsələn #F7EBDD.", pattern: { regex: "^#[0-9a-fA-F]{6}$", message: "rəngi #RRGGBB formatında yazın, məsələn #F7EBDD." } }
      - name: text_color
        label: Məqalə mətninin rəngi
        type: select
        description: "Avtomatik seçim fon rənginə uyğun oxunaqlı rəngi özü təyin edir."
        options:
          values:
            - { name: auto, label: Avtomatik }
            - { name: black, label: Tünd }
            - { name: white, label: Ağ }
      - { name: partner, label: Tərəfdaş materialıdır, type: boolean, description: "aktiv olduqda məqalədə tərəfdaş materialı qeydi göstərilir." }
      - name: status
        label: Yayımlanma vəziyyəti
        type: select
        required: true
        description: "Qaralama saytda görünmür; hazır məqaləni Yayımlanmış edin."
        options:
          values:
            - { name: draft, label: Qaralama — saytda görünmür }
            - { name: published, label: Yayımlanmış — saytda görünür }
      - { name: body, label: Məqalənin tam mətni, type: rich-text, required: true, description: "başlıqlar, siyahılar, keçidlər və mətn daxil edin; redaktorda əlavə şəkil də yerləşdirə bilərsiniz.", options: { format: markdown, media: media, path: articles, rename: safe } }
      - { name: seo, component: seo }

  - name: main_texts
    label: Ana və Haqqımızda mətnləri
    type: group
    description: "ana səhifənin sonundakı dəvət cümləsini və Haqqımızda səhifəsinin əsas mətnini dəyişin."
    items:
      - name: home_sentence
        label: Ana səhifədə I’NAZ haqqında cümlə
        type: file
        path: cumle.md
        format: yaml-frontmatter
        fields:
          - { name: title, label: CMS-də görünən ad, type: string, required: true, description: "yalnız idarəetmə panelində tanımaq üçündür; saytda görünmür." }
          - { name: body, label: Cümlə və ya qısa mətn, type: rich-text, required: true, description: "ana səhifədə I’NAZ haqqında başlığının altında görünür." }
      - name: about_text
        label: Haqqımızda səhifəsinin mətni
        type: file
        path: haqqinda.md
        format: yaml-frontmatter
        fields:
          - { name: title, label: CMS-də görünən ad, type: string, required: true, description: "yalnız idarəetmə panelində tanımaq üçündür; saytda görünmür." }
          - { name: body, label: Haqqımızda mətni, type: rich-text, required: true, description: "Haqqımızda səhifəsində əlaqə məlumatlarının üstündə görünən əsas mətndir." }
      - name: home_heading
        label: I’NAZ haqqında başlıq
        type: file
        path: content/data/home.yml
        fields:
          - { name: mission_title, label: Başlıq, type: string, required: true, description: "ana səhifədə I’NAZ haqqında hissəsinin iri başlığıdır." }

  - name: site_settings
    label: Sayt və əlaqə məlumatları
    type: file
    path: content/data/site.yml
    description: "sayt adını, loqoları, Google açıqlamasını və əlaqə keçidlərini idarə edir."
    fields:
      - { name: name, label: Sayt adı, type: string, required: true, description: "brauzer başlığında və SEO məlumatlarında istifadə edilir." }
      - { name: credit, label: Loqonun altındakı yazı, type: string, description: "loqo faylındakı alt yazının mətn qarşılığıdır." }
      - { name: language, label: Saytın dil kodu, type: string, required: true, description: "Google və brauzer üçün dil kodudur; Azərbaycan dili üçün az saxlayın." }
      - { name: description, label: Saytın Google açıqlaması, type: text, required: true, description: "ana səhifə axtarış nəticəsində görünəndə istifadə olunur." }
      - name: logo_dark
        label: Başlıq üçün tünd loqo
        type: image
        required: true
        description: "saytın yuxarı hissəsində görünür; mövcud loqonu görə və dəyişə bilərsiniz."
        options: { media: media, path: brand, extensions: [png, webp, svg], rename: safe }
      - name: logo_light
        label: Footer üçün açıq loqo
        type: image
        required: true
        description: "saytın tünd footer hissəsində görünür; şəffaf fonlu açıq loqo seçin."
        options: { media: media, path: brand, extensions: [png, webp, svg], rename: safe }
      - { name: email, label: E-poçt, type: string, required: true, description: "footer və Haqqımızda səhifəsində kliklənən əlaqə ünvanıdır." }
      - { name: phone, label: Telefon, type: string, required: true, description: "footer və Haqqımızda səhifəsində göstərilən telefon nömrəsidir." }
      - { name: instagram, label: Instagram keçidi, type: string, required: true, description: "profilin tam https:// ünvanını yazın." }
      - { name: whatsapp, label: WhatsApp keçidi, type: string, required: true, description: "söhbətə yönləndirən tam https:// ünvanını yazın." }
      - { name: base_url, label: Saytın domeni, type: string, required: true, description: "SEO üçün tam ünvanı saxlayın: https://inazmagazine.com" }

  - name: navigation
    label: Navbar və footer menyusu
    type: file
    path: content/data/navigation.yml
    list: true
    description: "yuxarı menyu ilə footerdə eyni keçidləri və sıralamanı idarə edir; URL-ləri dəyişərkən ehtiyatlı olun."
    fields:
      - { name: label, label: Menyuda görünən ad, type: string, required: true, description: "istifadəçinin navbar və footerdə gördüyü mətndir." }
      - { name: url, label: Açılacaq ünvan, type: string, required: true, description: "klik ediləndə açılan səhifə yoludur; məsələn /deb/." }
      - { name: order, label: Sıra, type: number, required: true, description: "kiçik rəqəm menyuda daha əvvəl görünür." }
      - { name: active, label: Menyuda göstər, type: boolean, description: "söndürdükdə keçid həm navbardan, həm də footerdən gizlənir." }

  - name: categories
    label: Bölmə səhifələri
    type: file
    path: content/data/categories.yml
    list: true
    description: "Dəb, Həyat tərzi və digər məzmun səhifələrinin adını və açıqlamasını idarə edir."
    fields:
      - { name: name, label: Bölmənin adı, type: string, required: true, description: "məqalə əlavə edərkən seçilən kateqoriya adı ilə eyni olmalıdır." }
      - { name: slug, label: Səhifə ünvanı, type: string, required: true, description: "yalnız kiçik latın hərfləri və defis istifadə edin; məsələn heyat-terzi.", pattern: "^[a-z0-9-]+$" }
      - { name: description, label: Bölmənin açıqlaması, type: text, required: true, description: "bölmə səhifəsində başlığın altında və Google nəticəsində görünür." }
      - { name: order, label: Sıra, type: number, required: true, description: "CMS-də bölmələrin sırasını müəyyən edir." }
      - { name: active, label: Bölmə aktivdir, type: boolean, description: "söndürülən bölmə üçün səhifə yaradılmır." }

  - name: legal_pages
    label: Məxfilik və istifadə qaydaları
    type: collection
    path: content/pages
    format: yaml-frontmatter
    filename: { template: "{title}.md", field: true }
    description: "footerin hüquqi səhifələrində görünən mətnləri redaktə edir; about faylını burada silməyin."
    view: { primary: title, fields: [status] }
    fields:
      - { name: title, label: Səhifə başlığı, type: string, required: true, description: "səhifənin yuxarısında və brauzer başlığında görünür." }
      - { name: description, label: Google açıqlaması, type: text, required: true, description: "axtarış sistemləri üçün qısa səhifə təsviridir." }
      - name: status
        label: Vəziyyət
        type: select
        required: true
        description: "Yayımlanmış saxlayın ki, səhifə saytda açılsın."
        options: { values: [{ name: draft, label: Qaralama }, { name: published, label: Yayımlanmış }] }
      - { name: body, label: Səhifənin mətni, type: rich-text, required: true, description: "məxfilik və ya istifadə qaydalarının tam mətnidir.", options: { format: markdown, media: media, path: pages, rename: safe } }
